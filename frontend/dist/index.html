<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyftr AI — LLM Failover &amp; Cache</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #070b14;
        color: #e2e8f0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulseDot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        40% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      .msg-enter {
        animation: fadeSlideUp 0.22s ease-out forwards;
      }
      .dot-1 {
        animation: pulseDot 1.2s infinite ease-in-out 0s;
      }
      .dot-2 {
        animation: pulseDot 1.2s infinite ease-in-out 0.2s;
      }
      .dot-3 {
        animation: pulseDot 1.2s infinite ease-in-out 0.4s;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.2);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.35);
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BIQdXBRi.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
