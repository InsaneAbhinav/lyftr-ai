services:
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////tmp/app.db
      - key: LLM_CACHE_DIR
        value: /tmp/llm_cache
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"

  - type: web
    name: lyftr-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://lyftr-ai-backend-x6is.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
