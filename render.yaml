services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_CACHE_DIR
        value: /data/llm_cache
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
    disk:
      name: lyftr-data
      mountPath: /data
      sizeGB: 1

  # ── Frontend (React/Vite static) ──────────────────────────────────────────
  - type: web
    name: lyftr-ai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
